            - 0
            - 1
        sort_order:
          type: integer
        time_added:
          type: integer
        period_length:
          type: integer
        minutes:
          type: integer
        seconds:
          type: integer
        developer_name:
          type: string
          enum:
            - 1ST_HALF
            - 2ND_HALF
            - ET
            - PENALTY_SHOOTOUT
            - ET_2ND_HALF
            - ET_1ST_HALF
      example:
        period_id: 2045635
        fixture_id: 1033370
        started: 1776875170
        ended: 1776878125
        counts_from: 0
        ticking: 0
        sort_order: 1
        time_added: 4
        period_length: 45
        minutes: 49
        seconds: 15
        developer_name: 1ST_HALF
    Odd:
      type: object
      description: >
        Core entity for pricing, settlement, and market data.  Note: Use
        `filter[odds]` in the query to refine this list.
      example:
        odd_id: 72919503
        fixture_id: 946305
        market_id: 203
        bookmaker_id: 2
        is_live: 0
        label_id: 2
        value: 2.1
        handicap: 3.5
        line: 3.5
        last_update: 1768081284
        suspend: 1
        sp: 1.8
        home_score: 0
        away_score: 0
        status: -1
        raw: {}
        player_id: null
        outcome: Lost
        market_description: Total number of cards in the match
        market_name: Asian Total Cards
        label_name: Over 3.5
      properties:
        odd_id:
          type: integer
          description: Unique identifier for this specific odd record.
        fixture_id:
          type: integer
          description: Identifier of the match (fixture) this odd belongs to.
        market_id:
          type: integer
          description: >-
            The category of the bet (e.g., 1 for Match Winner, 22 for Next
            Goal).
        bookmaker_id:
          type: integer
          description: The ID of the bookmaker providing this price.
        label_id:
          type: integer
          description: Internal identifier for the specific selection type within a market.
        player_id:
          type: integer
          nullable: true
          description: >-
            Unique identifier for a player. Populated for performance markets
            (e.g., Shots, Goalscorer).
        value:
          type: number
          format: float
          description: The current decimal odds (price).
        line:
          type: number
          format: float
          description: >-
            The numerical threshold for the bet (e.g., 2.5 in an Over/Under
            market).
        handicap:
          type: number
          format: float
          description: The point spread or goal handicap (if applicable).
        sp:
          type: number
          format: float
          description: Starting Price. The opening odds recorded for the event.
        suspend:
          type: integer
          enum:
            - 0
            - 1
          description: Boolean flag. If 1, the odd is currently locked and not tradable.
        is_live:
          type: integer
          enum:
            - 0
            - 1
          description: 1 for live/in-play events; 0 for pre-match.
        home_score:
          type: integer
          description: >-
            Home team score at generation. Used as 'base score' for Asian
            markets.
        away_score:
          type: integer
          description: >-
            Away team score at generation. Used as 'base score' for Asian
            markets.
        last_update:
          type: integer
          description: Unix timestamp of the last modification.
        status:
          type: integer
          enum:
            - 2
            - 1
            - 0
            - -1
            - -2
            - -3
          description: >
            Numerical result code: - **2**: Half Won - **1**: Won - **0**:
            Pending - **-1**: Lost - **-2**: Half Lost - **-3**: Void
        outcome:
          type: string
          description: Localized name of the status (e.g., 'Won', 'Half Lost').
        market_name:
          type: string
          description: Localized name of the betting market.
        market_description:
          type: string
          description: Brief localized explanation of the market rules.
        label_name:
          type: string
          description: Human-readable name of the specific pick (e.g., 'Over 3.5').
        raw:
          type: object
          description: >
            Container for external provider data. Use these IDs for betslip
            injection  or deep-linking to bookmaker platforms.
          example:
            event_id: 13936816
            market_id: 1339290698
            selection_id: 3314639099
    FairOdd:
      type: object
      description: Mathematical 'true' odds and probability for a specific market outcome.
      properties:
        market_id:
          type: integer
          description: Identifier for the betting market.
        label_id:
          type: integer
          description: Identifier for the specific outcome label.
        probability:
          type: number
          format: float
          description: The percentage probability of this outcome (0-100).
        value:
          type: number
          format: float
          description: The fair price in decimal odds format.
        handicap:
          type: number
          format: float
          nullable: true
          description: The handicap value, if applicable to the market.
        line:
          type: number
          format: float
          nullable: true
          description: The points/goals line, if applicable to the market.
      required:
        - market_id
        - label_id
        - probability
        - value
      example:
        market_id: 4
        label_id: 1
        probability: 20.07
        value: 4.984
        handicap: 1.5
        line: 1.5
    Movement:
      type: object
      description: A historical snapshot of an odd's value and status at a specific time.
      properties:
        odd_id:
          type: integer
          description: Identifier for the specific odd.
        value:
          type: number
          format: float
          description: The decimal value of the odd at this timestamp.
        suspend:
          type: integer
          enum:
            - 0
            - 1
          description: Indicates if the market was suspended (1) or active (0).
        last_update:
          type: integer
          description: Unix timestamp of the update.
      required:
        - odd_id
        - value
        - suspend
        - last_update
      example:
        odd_id: 88782664
        value: 1.43
        suspend: 0
        last_update: 1776785331
    Type:
      type: object
      properties:
        type_id:
          type: integer
          example: 1
          description: The unique ID for the type.
        developer_name:
          type: string
          example: 1ST_HALF
          description: The unique, constant-style identifier.
        developer_description:
          type: string
          example: First half of the match
          description: A brief explanation of the type's purpose.
        developer_type:
          type: string
          example: period
          description: The category or domain this type belongs to.
    Statistic:
      type: object
      description: Represents a specific performance metric for a team during a match.
      properties:
        team_id:
          type: integer
          example: 108
          description: The unique ID of the team the statistic belongs to.
        value:
          type: number
          example: 6
          description: The numerical value of the metric.
        type_id:
          type: integer
          example: 34
          nullable: true
          description: The unique ID associated with the statistic type.
        developer_name:
          type: string
          example: CORNERS
          description: The unique, constant-style identifier used for programmatic logic.
    Metric:
      type: object
      description: Machine-learned insights and AI-driven predictions.
      properties:
        team_id:
          type: integer
          example: 0
          description: The ID of the team (0 for match-level metrics).
        type_id:
          type: integer
          example: 105
          nullable: true
          description: The unique ID for the metric type.
        developer_name:
          type: string
          example: PREDICTION_GL_CONFIDENCE
          description: The unique constant-style identifier.
        value:
          type: number
          example: 70
          description: The calculated value or probability.
        meta:
          type: object
          nullable: true
          additionalProperties: true
          description: >
            Optional, context-specific metadata. Properties vary by metric
            family, and the field is omitted entirely for most `developer_name`
            values — including `EV_*` and `SMARTMONEY_*` metrics generated
            before this field was introduced. Always check for presence (e.g.
            `metric.meta?.market_id`) rather than assuming it exists.


            Known shapes:

            - `EV_*` (Expected Value, e.g. `EV_EUROPE_ML_HOME`): `market_id`,
            `label_id`, `line`, `bookmaker_id`.

            - `SMARTMONEY_*` (e.g. `SMARTMONEY_GL_OVER`): `market_id`,
            `label_id`, `line` (no `bookmaker_id`).
          properties:
            market_id:
              type: integer
              description: >-
                The betting market this metric relates to (e.g. 1 = Money Line,
                2 = Asian Handicap, 3 = Goal Line, 6 = Corners, 203 = Yellow
                Cards).
            label_id:
              type: integer
              description: >-
                The outcome label ID; mapping depends on market_id (same scheme
                as Odd.label_id).
            line:
              type: number
              format: float
              description: >-
                The main handicap/total line used for the calculation. Always 0
                for Money Line (market_id 1), which has no line.
            bookmaker_id:
              type: integer
              description: >-
                The bookmaker the price was sourced from (2 = Europe, 3 = Asia).
                Present only on EV_* metrics.
          example:
            market_id: 3
            label_id: 2
            line: 2.5
            bookmaker_id: 2
    PlayerMetric:
      type: object
      description: >
        A single rated attribute or predicted quantity for one player.


        **Two families share this shape, and they are read differently.** Tell
        them apart by `developer_name` (or by `type_id`: 380–383 vs 384–385).


        Every row belongs to **one fixture** and freezes at kick-off — it
        records the state before that match and is never revised afterwards. So
        the same player queried across two fixtures returns two different sets
        of values, and a past fixture reports what he looked like going into it
        rather than what he looks like now. A fixture that was never seen before
        kick-off carries no player metrics at all.


        **Ratings** (`PLAYER_IMPACT_INDEX`, `PLAYER_AGGRESSION_INDEX`,
        `PLAYER_DISCIPLINE_INDEX`, `PLAYER_SST_RATING`) describe the form the
        player took into this fixture. Each is an integer from **1 to 99** where
        **50 is average** for that player's position in that league — a defender
        is compared against other defenders, never against strikers — and
        **higher is always better**, Discipline included. Roughly 10 points is a
        meaningful gap; the middle 80% of players in a league typically fall
        between 25 and 80. These carry no `meta`.


        **Expected metrics** (`PLAYER_EXPECTED_SHOTS`,
        `PLAYER_EXPECTED_MINUTES`) are predictions for **this specific
        fixture**, not ratings. The value is a decimal count in the unit named
        by the metric — 1.293 shots, 65.926 minutes — so it is not on the 1–99
        scale and has no upper bound. These always carry `meta`.


        These move far more between fixtures than the ratings do — opponent,
        venue and the chance of starting all feed the model, and one player's
        expected shots measured 1.068 to 1.781 across six fixtures. Never carry
        an expected value from one fixture to another.


        **Expected metrics assume the team sheet is unknown.** The published
        `value` is already discounted for the chance the player does not start,
        which is the honest number before a lineup is confirmed. When you know
        the lineup, do not wait for us to recompute — read `meta.if_starts` or
        `meta.if_benched` directly. See `PlayerMetricMeta`.


        Further expected metrics — goals, assists, shots on target, booking
        points, fouls, tackles, passes and saves — are planned and will share
        this exact shape. None are returned today and no `type_id` is assigned
        to them; the `developer_name` enum below is the complete current set.
        Treat an unrecognised `developer_name` as forward compatibility rather
        than an error.
      properties:
        team_id:
          type: integer
          example: 4009
          description: >-
            The team the player is registered with. Match against
            `participants[].id` to tell home from away.
        player_id:
          type: integer
          example: 184521
          description: The player. Join to `squads[].player_id` for name and position.
        type_id:
          type: integer
          example: 380
          nullable: true
          description: The unique ID for the metric type.
        developer_name:
          type: string
          example: PLAYER_IMPACT_INDEX
          enum:
            - PLAYER_IMPACT_INDEX
            - PLAYER_AGGRESSION_INDEX
            - PLAYER_DISCIPLINE_INDEX
            - PLAYER_SST_RATING
            - PLAYER_EXPECTED_SHOTS
            - PLAYER_EXPECTED_MINUTES
          description: >
            Which attribute this row rates, or which quantity it predicts.


            **Ratings — integer 1–99, higher is better, no `meta`:**


            - `PLAYER_IMPACT_INDEX` (380) — how well the player does the main
            job of their position.
              What that job is depends on the position: shooting and scoring for an attacker
              (**Threat**), creating and winning the ball back for a midfielder (**Control**),
              clearing, blocking and intercepting for a defender (**Wall**), shot stopping for a
              goalkeeper (**Shield**). Derive which one applies from the player's position in
              `squads[]`.

            - `PLAYER_AGGRESSION_INDEX` (381) — how physically the player
            competes: fouls and
              tackles. A higher value means more of both.

            - `PLAYER_DISCIPLINE_INDEX` (382) — how well the player stays out of
            the referee's book
              relative to how often they foul. **A higher value means better discipline** — 99 is a
              player who is almost never booked, 1 is one who is booked constantly. A player can
              score high on both Aggression and Discipline: plenty of fouls, few cards.

            - `PLAYER_SST_RATING` (383) — a single overall rating combining the
            three above,
              weighted for the player's position.


            **Expected metrics — decimal count for this fixture, always carries
            `meta`:**


            - `PLAYER_EXPECTED_SHOTS` (384) — how many shots the player is
            expected to attempt.
              Counts every attempt, on target or not; blocked shots included.

            - `PLAYER_EXPECTED_MINUTES` (385) — how many minutes the player is
            expected to be on
              the pitch, 0–90+. Also the exposure behind every other expected metric, so it is the
              first thing to check when an expected count looks low: a good player who is unlikely
              to start has a low expected count for that reason alone.
        value:
          type: number
          example: 73
          description: >
            **Ratings** (380–383): integer 1–99, where 50 is average for the
            player's position in their league and higher is better on every
            metric.


            **Expected metrics** (384–385): a decimal count for this fixture —
            shots, or minutes — with no upper bound and no relation to the 1–99
            scale. Reported to 3 decimal places. This is the **pre-team-sheet**
            number, already weighted by the player's chance of starting; `meta`
            carries the two conditionals.
        meta:
          type: object
          nullable: true
          description: >
            Present **only on expected metrics** (384–385) and omitted entirely
            from the four ratings — check for presence rather than assuming it.
            See `PlayerMetricMeta`.
          allOf:
            - $ref: '#/components/schemas/PlayerMetricMeta'
      example:
        team_id: 1338
        player_id: 600
        type_id: 384
        developer_name: PLAYER_EXPECTED_SHOTS
        value: 1.228
        meta:
          if_starts: 1.694
          if_benched: 0.254
          p_start: 0.6764
    PlayerMetricMeta:
      type: object
      description: >
        The team-sheet breakdown behind an expected metric. Attached to
        `PLAYER_EXPECTED_SHOTS` and `PLAYER_EXPECTED_MINUTES`; never present on
        the four ratings.


        **Why it exists.** We publish expected metrics from the moment a fixture
        is scheduled, long before lineups exist, so the headline `value` has to
        assume the team sheet is unknown and blend the two cases:


        `value = p_start × if_starts + (1 − p_start) × if_benched`


        Worked from the example: `0.6764 × 1.694 + 0.3236 × 0.254 = 1.228`.


        **This is what lets you react to a confirmed lineup instantly.** Team
        sheets are typically published 15–60 minutes before kick-off. Rather
        than waiting for us to recompute and republish, substitute the case you
        now know is true: if the player is named in the XI use `if_starts`, if
        he is on the bench use `if_benched`, and if he is not in the squad at
        all treat every expected metric for him as 0.
      properties:
        if_starts:
          type: number
          example: 1.694
          description: >
            The expected value **conditional on the player starting**. Use this
            in place of `value` once a team sheet confirms he is in the starting
            XI.
        if_benched:
          type: number
          example: 0.254
          description: >
            The expected value **conditional on the player starting on the
            bench**. Already includes the chance he is not brought on at all, so
            it is much smaller than `if_starts` rather than simply being a
            shorter appearance — use it as-is, do not scale it further.
        p_start:
          type: number
          minimum: 0
          maximum: 1
          example: 0.6764
          description: >
            The probability the player starts, which produced the blend above.
            Published so the three numbers are self-consistent and auditable,
            and useful in its own right as a rotation read.
      example:
        if_starts: 1.694
        if_benched: 0.254
        p_start: 0.6764
    MetadataEntry:
      type: object
      description: >
        Fixture-level metadata. Currently only kit/participant colors
        (`PARTICIPANT_COLORS`) and formations (`FORMATION`) are returned; other
        raw metadata stored against a fixture is not yet exposed.
      properties:
        team_id:
          type: integer
          example: 85
          description: The team this metadata entry belongs to.
        type_id:
          type: integer
          example: 348
          description: The external type ID. 348 = PARTICIPANT_COLORS, 349 = FORMATION.
        developer_name:
          type: string
          example: PARTICIPANT_COLORS
          description: The constant-style identifier for the metadata type.
        value:
          type: integer
          nullable: true
          example: null
          description: >-
            Always null for PARTICIPANT_COLORS and FORMATION. Present for
            template consistency with other type-based includes.
        meta:
          type: object
          nullable: true
          additionalProperties: true
          description: >-
            Context-specific payload. For PARTICIPANT_COLORS, contains `kit` and
            `participant`. For FORMATION, contains `formation`.
          properties:
            kit:
              type: string
              example: >-
                #D6003D,#D6003D,#D6003D,#D6003D,#C40010,#0046A8,#C40010,#D6003D,#0A0A0A,#0A0A0A,#F0F0F0
              description: >-
                Comma-separated list of hex colors describing the team's kit
                (shirt, shorts, socks, sleeves, etc.).
            participant:
              type: string
              example: '#C40010'
              description: >-
                The primary/representative hex color for this team, used for
                charts, badges, and UI accents.
            formation:
              type: string
              example: 3-4-2-1
              description: The team's formation for this fixture.
    LastFixtureEntry:
      allOf:
        - $ref: '#/components/schemas/FixtureBase'
        - type: object
          properties:
            statistics:
              type: array
              items:
                $ref: '#/components/schemas/Statistic'
            metrics:
              type: array
              items:
                $ref: '#/components/schemas/Metric'
    LastFixtures:
      type: object
      description: >-
        Last 10 fixtures for each team in their respective location, before this
        event's kick-off. Each fixture includes statistics and metrics.
      properties:
        home:
          type: array
          description: Last 10 fixtures where the home team played at home.
          items:
            $ref: '#/components/schemas/LastFixtureEntry'
        away:
          type: array
          description: Last 10 fixtures where the away team played away.
          items:
            $ref: '#/components/schemas/LastFixtureEntry'
    Group:
      type: object
      description: The group this fixture belongs to (e.g. Group A in a cup tournament).
      properties:
        id:
          type: integer
        name:
          type: string
    Stage:
      type: object
      description: The competition stage (e.g. Quarter-Final, Group Stage).
      properties:
        id:
          type: integer
        name:
          type: string
    Season:
      type: object
      description: >-
        Information about the specific season during which the event or league
        takes place.
      properties:
        id:
          type: integer
          example: 17760
          description: The unique identifier for the season.
        name:
          type: string
          example: '2026'
          description: The name of the season, typically representing the year.
        starting_at:
          type: string
          format: date
          example: '2026-03-13'
          description: The official start date of the season.
        ending_at:
          type: string
          format: date
          example: '2026-11-30'
          description: The official end date of the season.
        is_current:
          type: boolean
          example: true
          description: Indicates if this is the active season.
    StandingsResponse:
      type: object
      required:
        - standings
      properties:
        standings:
          type: array
          items:
            $ref: '#/components/schemas/Standing'
    Standing:
      type: object
      description: One team's row in a league table for a given season/stage/group.
      properties:
        season:
          $ref: '#/components/schemas/Season'
        stage:
          nullable: true
          description: The competition stage this table belongs to. Null if not applicable.
          allOf:
            - $ref: '#/components/schemas/Stage'
        group:
          nullable: true
          description: >-
            The group within the stage (e.g. Group A in a cup competition). Null
            if not applicable.
          allOf:
            - $ref: '#/components/schemas/Group'
        position:
          type: integer
          nullable: true
          description: The team's rank in this table.
        team:
          $ref: '#/components/schemas/Team'
        points:
          type: integer
          nullable: true
          description: Total points.
        result:
          type: string
          nullable: true
          description: >-
            Qualification/relegation note for this position (e.g. 'Champions
            League', 'Relegation'), if any.
        statistics:
          type: array
          description: >
            Breakdown stats for this team in this table (matches played,
            won/drawn/lost, goals scored/against, etc.). Available
            `developer_name` values can be discovered via `GET /types`.
          items:
            $ref: '#/components/schemas/Statistic'
    Team:
      type: object
      description: Minimal team reference.
      properties:
        id:
          type: integer
          description: Unique identifier for the team.
        name:
          type: string
          description: Localized name of the team.

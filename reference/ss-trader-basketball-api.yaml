openapi: 3.0.0
info:
  version: 1.0.0
  title: SSTrader Basketball API
  description: >
    Basketball reference data and fixtures, under `/basketball/...`. Same paths
    and response shapes

    as football, read from basketball's own data. Read-only. Includes so far:
    `statistics`, `odds`, and

    on the single fixture `squads`, `lineups`.


    Basketball ids are **not** football ids: a basketball league, team, fixture
    or season id can

    have the same number as an unrelated football one. Always call the
    basketball endpoints with

    basketball ids.
servers:
  - url: https://api.sstrader.com/v1
tags:
  - name: Livescores
    description: Every live basketball game in one response, for in-play tracking.
  - name: Fixtures
    description: >-
      Basketball fixtures with participants, scores, periods, statistics and
      odds.
  - name: Regions
    description: Basketball regions, countries and leagues.
  - name: Countries
    description: Country reference data (shared with football).
  - name: Types
    description: >-
      Basketball's own types (periods, scores, statistics). Not football type
      ids.
  - name: Search
    description: Free-text lookup of basketball fixtures and countries.
  - name: Standings
    description: Basketball league tables for a given season.
paths:
  /basketball/fixtures:
    get:
      tags:
        - Fixtures
      summary: Get basketball fixtures with participants, scores and periods
      description: >
        Same query parameters, defaults and pagination as `GET
        /football/fixtures`. The list is

        kept compact: `statistics`, and `odds` limited to the main markets (see
        `include`). For one

        fixture use `GET /basketball/fixtures/{id}`. Returns 400 for:

        - any other `include`;

        - any `filter[...]` other than `filter[statistics]`, which also needs
        `include=statistics`;

        - `sport_id` (the path selects the sport).
      operationId: getBasketballFixtures
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/basketballIncludeParam'
        - $ref: '#/components/parameters/basketballStatisticsFilterParam'
        - in: query
          name: league_id
          schema:
            type: string
          description: Comma-separated list of basketball league IDs.
        - in: query
          name: fixture_id
          schema:
            type: string
          description: Comma-separated list of basketball fixture IDs.
        - in: query
          name: season_id
          schema:
            type: integer
          description: Basketball season ID.
        - in: query
          name: status
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/BasketballFixtureStatus'
          description: >
            Comma-separated list of fixture statuses to include. When omitted,
            fixtures of any status are returned except `DELETED`, which is only
            returned when named here.
        - in: query
          name: date
          schema:
            type: string
          description: >-
            Date in ISO 8601 YYYY-MM-DD format (DD-MM-YYYY is also accepted).
            Alias `for_date`.
        - in: query
          name: start_date
          schema:
            type: string
            format: date-time
          description: >-
            Start of the date range (with `end_date`). At most 30 days in the
            past.
        - in: query
          name: end_date
          schema:
            type: string
            format: date-time
          description: End of the date range (with `start_date`).
        - in: query
          name: is_live
          schema:
            type: integer
            enum:
              - 1
          description: Only fixtures in a live status. Ignores `page` and `per_page`.
        - in: query
          name: language
          schema:
            type: string
          description: >-
            Localization code (default: en). Basketball has no translations yet,
            so names are in English.
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/perPageParam'
        - $ref: '#/components/parameters/orderParam'
      responses:
        '200':
          description: A list of basketball fixtures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketballFixturesResponse'
        '400':
          $ref: '#/components/responses/BasketballBadRequest'
        '403':
          description: Unauthorized — missing or insufficient permissions.
  /basketball/fixtures/{id}:
    get:
      tags:
        - Fixtures
      summary: Get one basketball fixture
      description: >
        One fixture, in the same shape as `GET /basketball/fixtures`: a
        `fixtures` array that

        always holds exactly one fixture, without `pagination`. Use it for a
        fixture page; use the

        list for many fixtures at once.


        The response depends only on the URL and is cached for 5 seconds
        (`Cache-Control`), like

        the list.


        Returns 404 for an unknown or `DELETED` fixture, and 400 for an include
        or `filter[...]`

        that is not listed, and for `fixture_id` or `sport_id` in the query.
      operationId: getBasketballFixture
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Basketball fixture ID.
        - $ref: '#/components/parameters/basketballIncludeParam'
        - $ref: '#/components/parameters/basketballStatisticsFilterParam'
        - $ref: '#/components/parameters/basketballOddsFilterParam'
        - in: query
          name: language
          schema:
            type: string
          description: 'Localization code (default: en).'
      responses:
        '200':
          description: The fixture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketballFixtureResponse'
        '400':
          $ref: '#/components/responses/BasketballBadRequest'
        '403':
          description: Unauthorized — missing or insufficient permissions.
        '404':
          description: No such fixture.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Fixture not found
  /basketball/livescores:
    get:
      tags:
        - Livescores
      summary: Get every live basketball game
      description: >
        Every basketball game in a live status, in one response: a `fixtures`
        array, no

        pagination. The basketball version of `GET /football/livescores`. With
        `include=odds`,

        only in-play prices are returned (`is_live = 1`), every market and
        bookmaker unless

        `filter[odds]` narrows them. Details: `docs/basketball/livescores.md`.


        Returns 400 for any parameter not listed here (e.g. `lang`, `page`,
        `date`, `sport_id`),

        any other `include`, a `filter[...]` without its include, and an unknown
        filter key

        (`is_live` included: it is always 1).
      operationId: getBasketballLivescores
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: league_id
          schema:
            type: string
          description: Comma-separated list of basketball league IDs.
        - in: query
          name: language
          schema:
            type: string
          description: >-
            Localization code (default: en). Basketball has no translations yet,
            so names are in English; odds names are translated.
        - in: query
          name: include
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - statistics
                - odds
                - metrics
          description: >-
            Comma-separated modules to attach: `statistics`, `odds` (in-play
            prices only), `metrics` (opening and closing lines, see
            `docs/basketball/metrics.md`).
        - $ref: '#/components/parameters/basketballStatisticsFilterParam'
        - name: filter[odds]
          in: query
          description: >
            Requires `include=odds`. Keys separated by `;`, values by `,`:
            `bookmakers:ID,...`, `markets:ID,...`, `suspend:0|1`. No `is_live`
            key: livescores always returns in-play prices.
          schema:
            type: string
          example: markets:18001,18002,18003;suspend:0
      responses:
        '200':
          description: Every live basketball game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketballLivescoresResponse'
        '400':
          $ref: '#/components/responses/BasketballBadRequest'
        '403':
          description: Unauthorized — missing or insufficient permissions.
  /basketball/regions:
    get:
      tags:
        - Regions
      summary: Get basketball regions, countries and leagues
      description: >
        Same parameters and response as `GET /football/regions`. `sport_id` is
        refused with 400.

        `has_search` is always `false` (basketball leagues are not in free-text
        search yet).
      operationId: getBasketballRegions
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              - upcoming
              - all
            default: upcoming
          description: Filter leagues by their status.
        - in: query
          name: language
          schema:
            type: string
            default: en
          description: Language for the response.
        - in: query
          name: league_level
          schema:
            type: string
          description: Comma-separated list of league tiers. Default 1,2,3.
        - in: query
          name: country_id
          schema:
            type: string
          description: Comma-separated list of country IDs.
      responses:
        '200':
          description: A list of regions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsResponse'
        '400':
          $ref: '#/components/responses/BasketballBadRequest'
        '403':
          description: Unauthorized — missing or insufficient permissions.
  /basketball/leagues/{id}:
    get:
      tags:
        - Regions
      summary: Get one basketball league
      description: One league in the same shape as a `GET /basketball/regions` item.
      operationId: getBasketballLeague
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Basketball league ID.
        - in: query
          name: language
          schema:
            type: string
            default: en
          description: Language for the response.
      responses:
        '200':
          description: The league
          content:
            application/json:
              schema:
                type: object
                properties:
                  league:
                    $ref: '#/components/schemas/RegionItem'
        '400':
          $ref: '#/components/responses/BasketballBadRequest'
        '403':
          description: Unauthorized — missing or insufficient permissions.
        '404':
          description: League not found.
  /basketball/countries:
    get:
      tags:
        - Countries
      summary: Get all countries (basketball)
      description: Same response as `GET /football/countries`, read from basketball's data.
      operationId: getBasketballCountries
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: language
          schema:
            type: string
            default: en
          description: Language for the response.
      responses:
        '200':
          description: A list of countries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesResponse'
        '403':
          description: Unauthorized — missing or insufficient permissions.
  /basketball/search:
    get:
      tags:
        - Search
      summary: Search basketball fixtures and countries by free-text query
      description: >
        Same parameters and response shape as `GET /football/search`, for
        basketball. Supported

        `types`: `fixture` and `country`. `team`, `league` and `player` are
        refused with `400`

        (no basketball search for them yet).


        `fixture` covers basketball matches from a few hours ago to about a week
        ahead, in

        top-tier leagues. Countries are the same as football's (same ids and
        names), so `country`

        returns the same results on both sports.
      operationId: searchBasketballEntities
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: The search text.
          example: celtics bulls
        - in: query
          name: types
          required: true
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - country
                - fixture
          description: >-
            Comma-separated list of entity types to search: `country`,
            `fixture`.
          example: fixture
        - in: query
          name: limit
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
          description: Maximum results per type.
        - in: query
          name: language
          schema:
            type: string
            enum:
              - en
              - es
              - bg
            default: en
          description: >-
            Language for localized names (basketball names are English only for
            now).
      responses:
        '200':
          description: Search results grouped by entity type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEntitiesResponse'
        '400':
          description: Missing `q` or `types`, or an unsupported type.
          content:
            application/json:
              example:
                error: 'Unsupported type(s): team. Supported: country, fixture'
        '403':
          description: Unauthorized — missing or insufficient permissions.
        '500':
          description: Search is temporarily unavailable, or an internal error occurred.
  /basketball/types:
    get:
      tags:
        - Types
      summary: Get all basketball types
      description: >
        Basketball's own types (periods such as `Q1`..`Q4`, `OT1`.., and score
        types). Basketball

        type IDs are not football type IDs. `developer_type` is not filled in
        yet, so a

        `developer_types` filter currently matches nothing.
      operationId: getBasketballTypes
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: developer_types
          schema:
            type: string
          description: >-
            Comma-separated list of domain groups to filter by. Alias
            `developer_type`.
      responses:
        '200':
          description: A list of types
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/Type'
        '403':
          description: Unauthorized — missing or insufficient permissions.
  /basketball/standings:
    get:
      tags:
        - Standings
      summary: Get basketball standings for a season
      description: >
        Same parameters and row shape as `GET /football/standings`, read from
        basketball's data.

        As with football, group rows by `stage.id` and `group.id` to draw each
        table. In basketball

        every row has a `group`: e.g. the NBA's "Eastern Conference" and
        "Western Conference"

        (regular season and preseason), the NBA Cup groups, one per NCAA
        conference, or "Group A"..

        of a FIBA qualifier stage. A team has one row per group it is in.
        `group` also carries a

        `scope` (Regular Season, Preseason, Group Stage, ...).


        `statistics` use basketball types (`WON`, `LOST`, `STREAK`, `HOME_WON`,
        ...). Values are

        integers: types ending in `_X10` / `_X1000` are scaled (`WON_RATE_X1000`
        750 = 0.750,

        `POINTS_AVG_X10` 1125 = 112.5). Not every league has every type.
        `points` is often `null`.
      operationId: getBasketballStandings
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: season_id
          required: true
          schema:
            type: integer
          description: The basketball season to retrieve standings for.
        - in: query
          name: language
          schema:
            type: string
            default: en
          description: 'Localization code for team names. Alias: `lang`.'
      responses:
        '200':
          description: >-
            Standings rows for the season, ordered by stage, scope, group name,
            then position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketballStandingsResponse'
        '400':
          description: '`season_id` missing or not a valid integer.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                missing_season_id:
                  value:
                    error: season_id is required
        '403':
          description: Unauthorized — missing or insufficient role.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  responses:
    BasketballBadRequest:
      description: Invalid or unsupported parameter.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
          examples:
            include:
              value:
                error: >-
                  include odds is not available on /basketball/fixtures.
                  Available: statistics
            filter:
              value:
                error: filter[markets] is not available on /basketball/fixtures
            filter_without_include:
              value:
                error: filter[statistics] needs include=statistics
            sport_id:
              value:
                error: >-
                  sport_id is not supported on /basketball/fixtures; the path
                  selects the sport
  parameters:
    basketballIncludeParam:
      name: include
      in: query
      description: >
        Comma-separated modules to attach: `statistics`, `odds`, and on the
        single route only `squads` and `lineups` (400 on the list). On the list,
        `odds` holds only markets 18001-18003 from bookmakers 2, 3, 6, 7,
        current prices only (`suspend = 0`); the single route returns every
        market, bookmaker and row. `squads` = both teams' season rosters;
        `lineups` = the players named for the game, `type_id` 701 STARTER / 702
        BENCH. Details: `docs/basketball/squads-lineups.md`.
      schema:
        type: string
        example: statistics,odds
    basketballOddsFilterParam:
      name: filter[odds]
      in: query
      description: >
        Single route only (400 on the list); requires `include=odds`. Keys
        separated by `;`, values by `,`: `bookmakers:ID,...`, `markets:ID,...`,
        `is_live:0|1`, `suspend:0|1`.
      schema:
        type: string
      example: markets:18001,18100;bookmakers:6;suspend:0
    basketballStatisticsFilterParam:
      name: filter[statistics]
      in: query
      description: >
        Narrows the `statistics` include (requires `include=statistics`).
        `types:ID,...` returns only those basketball type ids (see `GET
        /basketball/types`); `developer_types:name,...` filters by type group.
        Several keys are separated by `;`. A filter that matches no type returns
        an empty `statistics` array.
      schema:
        type: string
      example: types:32,33
    pageParam:
      name: page
      in: query
      description: The current page number.
      schema:
        type: integer
        default: 1
        minimum: 1
    perPageParam:
      name: per_page
      in: query
      description: >-
        Results returned per page. Note that per_page only affects the base
        entity; included relations are not paginated.
      schema:
        type: integer
        default: 25
        minimum: 1
        maximum: 50
    orderParam:
      name: order
      in: query
      description: Sort order of results.
      schema:
        type: string
        enum:
          - asc
          - desc
        default: asc
  schemas:
    RegionsResponse:
      type: object
      required:
        - regions
      properties:
        regions:
          type: array
          items:
            $ref: '#/components/schemas/RegionItem'
    RegionItem:
      type: object
      properties:
        region:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        country:
          $ref: '#/components/schemas/Country'
        league:
          $ref: '#/components/schemas/League'
        season:
          $ref: '#/components/schemas/Season'
        sport:
          $ref: '#/components/schemas/Sport'
        count:
          type: integer
          description: Upcoming fixtures count
        live:
          type: integer
          description: Live fixtures count
        popular:
          type: boolean
        level:
          type: integer
          description: League level
    PaginationMetadata:
      type: object
      required:
        - page
        - per_page
        - has_more
        - order
      properties:
        page:
          type: integer
          example: 1
          description: The current page number.
        per_page:
          type: integer
          example: 50
          description: Number of results returned on this page.
        has_more:
          type: boolean
          example: true
          description: >
            `true` if more pages are available, `false` if this is the last
            page. Determined by whether the number of results returned equals
            `per_page`.
        order:
          type: string
          enum:
            - asc
            - desc
          example: asc
          description: Sort order — `asc` or `desc`.
    CountriesResponse:
      type: object
      required:
        - countries
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
    SearchEntitiesResponse:
      type: object
      description: >
        Grouped by entity type. Only the types requested via `types` are present
        as keys.
      properties:
        countries:
          type: array
          items:
            $ref: '#/components/schemas/SearchCountryResult'
        fixtures:
          type: array
          items:
            $ref: '#/components/schemas/SearchFixtureResult'
    SearchCountryResult:
      allOf:
        - $ref: '#/components/schemas/Country'
        - type: object
          properties:
            score:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: Match confidence — higher means a closer match to `q`.
    SearchFixtureResult:
      description: >
        Same base shape as a `GET /basketball/fixtures` item (without any
        `include=` modules), plus a `score`. Reranked by relevance to `q`.
      allOf:
        - $ref: '#/components/schemas/FixtureBase'
        - type: object
          properties:
            score:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: Match confidence — higher means a closer match to `q`.
    FixturesPaginationMetadata:
      allOf:
        - $ref: '#/components/schemas/PaginationMetadata'
        - type: object
          required:
            - total
            - total_pages
          properties:
            total:
              type: integer
              example: 7802
              description: >
                Number of fixtures matching the filters, across all pages.
                Counted at the time of the request.
            total_pages:
              type: integer
              example: 313
              description: '`ceil(total / per_page)`; `0` when nothing matches.'
            has_more:
              type: boolean
              example: true
              description: >
                Exact: `true` only when at least one more fixture exists past
                this page (`page * per_page < total`).
          description: >
            With `is_live` set, `page` and `per_page` are ignored and every live
            fixture is returned on one page: `page: 1`, `per_page` and `total`
            equal to the number of live fixtures, `total_pages` `1` (or `0` when
            none are live), `has_more: false`.
    FixtureBase:
      type: object
      properties:
        id:
          type: integer
        date_time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BasketballFixtureStatus'
        is_live:
          type: boolean
        language:
          type: string
        sport:
          $ref: '#/components/schemas/Sport'
        country:
          $ref: '#/components/schemas/Country'
        league:
          $ref: '#/components/schemas/League'
        season:
          $ref: '#/components/schemas/Season'
        group:
          nullable: true
          description: 'Always null: basketball fixtures have no groups.'
          allOf:
            - $ref: '#/components/schemas/Group'
        stage:
          nullable: true
          description: The competition stage. Null if not applicable.
          allOf:
            - $ref: '#/components/schemas/Stage'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/BasketballScore'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/BasketballPeriod'
    Sport:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
    Country:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        alpha3:
          type: string
    League:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the league.
        name:
          type: string
          description: Official name of the league.
        level:
          type: integer
          description: >-
            The tier of the league (e.g., 1 for top-flight, 2 for second
            division).
    Participant:
      type: object
      description: Details about a specific team or competitor involved in the match.
      properties:
        id:
          type: integer
          description: Unique identifier for the participant.
        name:
          type: string
          description: Localized name of the team or competitor.
        position:
          type: integer
          description: The team's current standing/rank in their respective league table.
        location:
          type: string
          enum:
            - home
            - away
          description: >-
            Indicates the venue role. `home` for the hosting team and `away` for
            the visiting team.
    Odd:
      type: object
      description: >
        Core entity for pricing, settlement, and market data.  Note: Use
        `filter[odds]` in the query to refine this list.
      example:
        odd_id: 1526890
        fixture_id: 2085
        market_id: 18003
        bookmaker_id: 6
        is_live: 0
        label_id: 2
        value: 1.9
        handicap: 165.5
        line: 165.5
        last_update: 1772005284
        suspend: 0
        sp: 1.87
        home_score: 0
        away_score: 0
        status: 0
        raw: {}
        player_id: null
        outcome: Pending
        market_description: Total points scored in the game (incl. OT)
        market_name: Total Points (incl. OT)
        label_name: Over 165.5
      properties:
        odd_id:
          type: integer
          description: Unique identifier for this specific odd record.
        fixture_id:
          type: integer
          description: Identifier of the match (fixture) this odd belongs to.
        market_id:
          type: integer
          description: >-
            The category of the bet (e.g., 18001 Money Line, 18002 Handicap,
            18003 Total Points). Full list in docs/basketball/markets.md.
        bookmaker_id:
          type: integer
          description: The ID of the bookmaker providing this price.
        label_id:
          type: integer
          description: Internal identifier for the specific selection type within a market.
        player_id:
          type: integer
          nullable: true
          description: >-
            Player markets (18100-18110) only, and null until the player is
            mapped. Null on every team or game market (Money Line, Handicap,
            Total Points, ...).
        value:
          type: number
          format: float
          description: The current decimal odds (price).
        line:
          type: number
          format: float
          description: >-
            The numerical threshold for the bet (e.g., 165.5 in a Total Points
            market).
        handicap:
          type: number
          format: float
          description: The point spread (if applicable).
        sp:
          type: number
          format: float
          description: Starting Price. The opening odds recorded for the event.
        suspend:
          type: integer
          enum:
            - 0
            - 1
          description: Boolean flag. If 1, the odd is currently locked and not tradable.
        is_live:
          type: integer
          enum:
            - 0
            - 1
          description: 1 for live/in-play events; 0 for pre-match.
        home_score:
          type: integer
          description: Home team score when the price was generated.
        away_score:
          type: integer
          description: Away team score when the price was generated.
        last_update:
          type: integer
          description: Unix timestamp of the last modification.
        status:
          type: integer
          enum:
            - 2
            - 1
            - 0
            - -1
            - -2
            - -3
          description: >
            Numerical result code: - **2**: Half Won - **1**: Won - **0**:
            Pending - **-1**: Lost - **-2**: Half Lost - **-3**: Void
        outcome:
          type: string
          description: Localized name of the status (e.g., 'Won', 'Half Lost').
        market_name:
          type: string
          description: Localized name of the betting market.
        market_description:
          type: string
          description: Brief localized explanation of the market rules.
        label_name:
          type: string
          description: Human-readable name of the specific pick (e.g., 'Over 3.5').
        raw:
          type: object
          additionalProperties: true
          description: >
            The bookmaker's own reference data for this exact price — enough to
            place the selection on their platform or deep-link to it. Opaque,
            and the set of fields varies by bookmaker; `{}` when the bookmaker
            publishes none.


            **Treat every id here as an opaque string.** Some are alphanumeric;
            others are integers too large for an IEEE-754 double (`event_id`
            runs to 18 digits on some bookmakers) and are therefore sent quoted,
            so every digit survives `JSON.parse`. Depending on the bookmaker the
            same field may arrive quoted or unquoted — compare and store these
            as text, and never parse them into numbers.


            Do not confuse these with the sibling `market_id`, `label_id` and
            `player_id` fields, which are SSTrader's own numbering and unrelated
            despite the similar names.


            Filter to a single bookmaker (`filter[odds]=bookmakers:<id>`) before
            reading this — an unfiltered response mixes several bookmakers'
            formats in one list.
          example:
            event_id: '900140426512904192'
            market_id: 0HC900140427695714337
            selection_id: 0HC900140427695714337HM200
            market_type_id: HC660
    Type:
      type: object
      properties:
        type_id:
          type: integer
          example: 55
          description: >-
            The unique ID for the type. Basketball type ids are not football
            type ids.
        developer_name:
          type: string
          example: POINTS
          description: The unique, constant-style identifier.
        developer_description:
          type: string
          example: Points
          description: A brief explanation of the type's purpose.
        developer_type:
          type: string
          nullable: true
          description: >-
            The category or domain this type belongs to. Not filled in yet for
            basketball.
    Statistic:
      type: object
      description: >-
        One team total for one statistic type (see
        docs/basketball/statistics.md).
      properties:
        team_id:
          type: integer
          example: 1767
          description: The unique ID of the team the statistic belongs to.
        value:
          type: number
          example: 84
          description: The numerical value of the metric.
        type_id:
          type: integer
          example: 55
          nullable: true
          description: The basketball type id (`GET /basketball/types`).
        developer_name:
          type: string
          example: POINTS
          description: The unique, constant-style identifier used for programmatic logic.
    Group:
      type: object
      description: The group this fixture belongs to (e.g. Group A in a cup tournament).
      properties:
        id:
          type: integer
        name:
          type: string
    Stage:
      type: object
      description: The competition stage (e.g. Quarter-Final, Group Stage).
      properties:
        id:
          type: integer
        name:
          type: string
    Season:
      type: object
      description: >-
        Information about the specific season during which the event or league
        takes place.
      properties:
        id:
          type: integer
          example: 986
          description: The unique identifier for the season.
        name:
          type: string
          example: 2026-2027
          description: The name of the season, typically representing the year.
        starting_at:
          type: string
          format: date
          example: '2026-09-25'
          description: The official start date of the season.
        ending_at:
          type: string
          format: date
          example: '2027-04-18'
          description: The official end date of the season.
        is_current:
          type: boolean
          example: true
          description: Indicates if this is the active season.
    BasketballFixturesResponse:
      type: object
      required:
        - fixtures
        - pagination
      properties:
        fixtures:
          type: array
          items:
            $ref: '#/components/schemas/BasketballFixture'
        pagination:
          $ref: '#/components/schemas/FixturesPaginationMetadata'
    BasketballLivescoresResponse:
      type: object
      required:
        - fixtures
      properties:
        fixtures:
          type: array
          items:
            $ref: '#/components/schemas/BasketballFixture'
    BasketballFixtureResponse:
      type: object
      required:
        - fixtures
      properties:
        fixtures:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/BasketballFixture'
    BasketballFixtureStatus:
      type: string
      description: >
        Basketball fixture status. Live: `INPLAY_Q1`..`INPLAY_Q4`, `INPLAY_OT`,
        `HT`,

        `BREAK_Q1`, `BREAK_Q3`. Seen in the feed so far: `NOT_STARTED`,
        `INPLAY_Q1`..`INPLAY_Q4`,

        `HT`, `BREAK_Q1`, `FT`, `TBA`, `POSTPONED`, `CANCELLED`, `DELETED`.
        `INPLAY_OT` and

        `BREAK_Q3` follow the same naming but have not been seen yet, so they
        may change.
      enum:
        - NOT_STARTED
        - INPLAY_Q1
        - INPLAY_Q2
        - INPLAY_Q3
        - INPLAY_Q4
        - INPLAY_OT
        - HT
        - BREAK_Q1
        - BREAK_Q3
        - FT
        - TBA
        - POSTPONED
        - CANCELLED
        - DELETED
    BasketballFixture:
      type: object
      description: Same shape as a football fixture; `group` is always null.
      properties:
        id:
          type: integer
        date_time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/BasketballFixtureStatus'
        is_live:
          type: boolean
        language:
          type: string
        sport:
          $ref: '#/components/schemas/Sport'
        country:
          $ref: '#/components/schemas/Country'
        league:
          $ref: '#/components/schemas/League'
        season:
          $ref: '#/components/schemas/Season'
        group:
          nullable: true
          description: 'Always null: basketball has no groups.'
          allOf:
            - $ref: '#/components/schemas/Group'
        stage:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Stage'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/BasketballScore'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/BasketballPeriod'
        statistics:
          type: array
          description: >
            Only with `include=statistics`. Team totals, same shape as
            football's statistics, with

            basketball type ids (e.g. `TWO_POINTS_MADE`, `FREE_THROW_PCT`,
            `TIMEOUTS_REMAINING`).

            While a game is live it also carries `PERIOD_TEAM_FOULS` (2007, the
            team's fouls in the

            current period) and `IN_BONUS` (2008, 1 = the opponent's next common
            foul sends this

            team to the line) where the competition has live personal fouls; see

            docs/basketball/statistics.md.
          items:
            $ref: '#/components/schemas/Statistic'
        odds:
          type: array
          description: >-
            Only with `include=odds`. Market and label ids in
            docs/basketball/markets.md.
          items:
            $ref: '#/components/schemas/BasketballOdd'
    BasketballOdd:
      description: >
        `Odd` (including `raw`, the bookmaker's own reference data), plus
        `player_name`.

        `label_name` signs handicaps (`+1.5`).
      allOf:
        - $ref: '#/components/schemas/Odd'
        - type: object
          properties:
            player_name:
              type: string
              nullable: true
              description: >-
                Player props (18100-18110): the bookmaker's name for the player.
                `player_id` stays null until basketball players are mapped. Null
                on every other market.
      example:
        odd_id: 1526886
        fixture_id: 2085
        market_id: 18002
        bookmaker_id: 6
        is_live: 1
        label_id: 1
        value: 1.85
        handicap: -16.5
        line: -16.5
        sp: 1.9
        suspend: 0
        home_score: 0
        away_score: 0
        last_update: 1772005284
        status: 0
        player_id: null
        player_name: null
        raw:
          event_id: '900140426512904192'
          market_id: 0HC900140427695714337
          selection_id: 0HC900140427695714337HM200
          market_type_id: HC660
        outcome: Pending
        market_name: Handicap (incl. OT)
        market_description: Points difference with a handicap applied (full game, incl. OT)
        label_name: Bayern Munchen -16.5
    BasketballScore:
      type: object
      description: >
        Points for one team in one score bucket. Quarters `Q1`..`Q4` and
        overtimes `OT1`, `OT2`, ...

        hold the points of that period only; `HALF_TIME` is Q1+Q2, `REGULATION`
        is Q1..Q4,

        `OVERTIME` is all overtimes together (0 without overtime), `CURRENT` is
        the total.

        `1ST_HALF` / `2ND_HALF` appear for competitions played in halves.
      properties:
        fixture_id:
          type: integer
        team_id:
          type: integer
        value:
          type: integer
          description: Points.
        developer_name:
          type: string
          enum:
            - Q1
            - Q2
            - Q3
            - Q4
            - OT1
            - OT2
            - OT3
            - OT4
            - OT5
            - 1ST_HALF
            - 2ND_HALF
            - HALF_TIME
            - REGULATION
            - OVERTIME
            - CURRENT
      required:
        - fixture_id
        - team_id
        - value
        - developer_name
      example:
        fixture_id: 164
        team_id: 210
        value: 103
        developer_name: CURRENT
    BasketballPeriod:
      type: object
      description: >-
        Clock details for one quarter, overtime or half. Same fields as the
        football Period.
      properties:
        period_id:
          type: integer
        fixture_id:
          type: integer
        started:
          type: integer
          description: Unix timestamp
        ended:
          type: integer
          description: Unix timestamp
        counts_from:
          type: integer
        ticking:
          type: integer
          enum:
            - 0
            - 1
        sort_order:
          type: integer
        time_added:
          type: integer
          nullable: true
        period_length:
          type: integer
          description: Minutes, e.g. 10 for a FIBA quarter, 5 for overtime.
        minutes:
          type: integer
        seconds:
          type: integer
        developer_name:
          type: string
          enum:
            - Q1
            - Q2
            - Q3
            - Q4
            - OT1
            - OT2
            - OT3
            - OT4
            - OT5
            - 1ST_HALF
            - 2ND_HALF
      example:
        period_id: 3011
        fixture_id: 164
        started: 1792350913
        ended: 1792351768
        counts_from: 40
        ticking: 0
        sort_order: 5
        time_added: null
        period_length: 5
        minutes: 5
        seconds: 0
        developer_name: OT1
    Standing:
      type: object
      description: One team's row in a league table for a given season/stage/group.
      properties:
        season:
          $ref: '#/components/schemas/Season'
        stage:
          nullable: true
          description: The competition stage this table belongs to. Null if not applicable.
          allOf:
            - $ref: '#/components/schemas/Stage'
        group:
          nullable: true
          description: The group within the stage (e.g. Eastern Conference).
          allOf:
            - $ref: '#/components/schemas/Group'
        position:
          type: integer
          nullable: true
          description: The team's rank in this table.
        team:
          $ref: '#/components/schemas/Team'
        points:
          type: integer
          nullable: true
          description: Total points.
        result:
          type: string
          nullable: true
          description: Qualification note for this position (e.g. 'Playoffs'), if any.
        statistics:
          type: array
          description: >
            Breakdown stats for this team in this table (`WON`, `LOST`,
            `STREAK`, `HOME_WON`, ...). Types ending in `_X10` / `_X1000` are
            scaled. Available `developer_name` values can be discovered via `GET
            /basketball/types`.
          items:
            $ref: '#/components/schemas/Statistic'
    BasketballStandingsResponse:
      type: object
      required:
        - standings
      properties:
        standings:
          type: array
          items:
            $ref: '#/components/schemas/BasketballStanding'
    BasketballStanding:
      description: A `Standing` row whose `group` is always set and carries a `scope`.
      allOf:
        - $ref: '#/components/schemas/Standing'
        - type: object
          properties:
            group:
              type: object
              description: >-
                The table this row belongs to. Group rows by `stage.id` and
                `group.id`.
              properties:
                id:
                  type: integer
                  description: Identifies the group within its season.
                  example: 1125
                name:
                  type: string
                  example: Eastern Conference
                scope:
                  type: object
                  nullable: true
                  description: What the group covers. Null when unknown.
                  properties:
                    type_id:
                      type: integer
                      example: 405
                    developer_name:
                      type: string
                      enum:
                        - SCOPE_SEASON
                        - SCOPE_QUALIFIER
                        - SCOPE_GROUP_STAGE
                        - SCOPE_PRESEASON
                        - SCOPE_REGULAR_SEASON
                        - SCOPE_PLAYOFFS
                    name:
                      type: string
                      example: Regular Season
    Team:
      type: object
      description: Minimal team reference.
      properties:
        id:
          type: integer
          description: Unique identifier for the team.
        name:
          type: string
          description: Localized name of the team.
